name: Windows CI

on:
  push:
    branches:
      - v1-implementation
  pull_request:
    branches:
      - v1-implementation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kilo-bridge-windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, and tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck source and tests
        run: pnpm typecheck

      - name: Build and run the complete test suite
        run: pnpm test
